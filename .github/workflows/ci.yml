name: Microservices Integration CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - loan-gateway
          - scoring-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Postgres and Kafka
        # Если docker-compose.yml лежит в папке monitoring, добавьте флаг: -f monitoring/docker-compose.yml
        # Флаг --wait ожидает статуса "healthy" от healthcheck
        run: docker compose up -d --wait postgres kafka

      - name: Run Integration Tests
        working-directory: ${{ matrix.service }}
        run: mvn clean test

      - name: Stop Infrastructure
        if: always()
        run: docker compose down

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/