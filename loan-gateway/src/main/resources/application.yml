spring:
  application:
    name: loan-gateway

  # Локальные секреты (DB_PASSWORD и др.) читаются из .env, который не попадает в git.
  # Запуск из корня проекта или из папки модуля; переменные окружения имеют приоритет.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # Настройки подключения к PostgreSQL
  datasource:
    # Все параметры БД задаются переменными окружения; значения по умолчанию — для локального docker-compose
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:loan_db}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER:loan_admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Настройки пула соединений HikariCP
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000

  # Настройки JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  # Настройки подключения к Apache Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    # 1. Настройки ОТПРАВИТЕЛЯ
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    # 2. Настройки СЛУШАТЕЛЯ
    consumer:
      group-id: gateway-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer оборачивает JsonDeserializer: битое сообщение не блокирует consumer,
      # а передаётся в error handler и пропускается
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.microloan.gateway.dto"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.microloan.gateway.dto.ScoringResult

# Настройки сетевого уровня
server:
  port: ${SERVER_PORT:8081}

# Настройки Actuator и Micrometer для сбора метрик прометеуса и графаны
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name} # Сквозной тег для Grafana, чтобы группировать метрики по имени сервиса